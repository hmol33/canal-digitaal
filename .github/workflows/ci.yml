name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        sudo apt-get update && sudo apt-get install -y jq

    - name: Lint Python scripts
      run: |
        python3 -m py_compile .github/build_repo_addon.py
        python3 -m py_compile .github/build_readme.py

    - name: Validate config.json
      run: |
        python3 -c "import json; json.load(open('.github/config.json'))"

    - name: Check shell scripts
      run: |
        bash -n .github/build.sh
